[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repomapper"
version = "2.0.0"
description = "AST-guided repository context mapping for AI coding agents."
readme = "README.md"
authors = [{ name = "RepoMapper Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "tiktoken>=0.5.0",
    "grep-ast>=0.3.0",
    "tree-sitter>=0.20.0",
    "mcp>=0.1.0",
]

[project.scripts]
repomap = "repomap:main"
repomap-server = "repomap_server:main"
